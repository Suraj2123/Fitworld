<dialog id="workout-detail" class="wide-dialog" aria-labelledby="detail-title">
  <div class="dialog-header"><p class="eyebrow">A LITTLE TIME FOR YOU</p><button type="button" class="icon-button" data-close aria-label="Close workout details">×</button></div>
  <div id="detail-content"></div>
  <button type="button" class="primary-button" id="detail-log">Log this workout <span aria-hidden="true">↗</span></button>
</dialog>
<dialog id="workout-log-dialog" class="wide-dialog" aria-labelledby="log-title">
  <div class="dialog-header"><h2 id="log-title">Make it count.</h2><button type="button" class="icon-button" data-close aria-label="Close workout log">×</button></div>
  <p class="muted">Record what you did. A shorter session counts, too.</p>
  <form id="workout-log-form">
    <div class="form-error error-box" role="alert" tabindex="-1" hidden></div>
    <label for="log-workout">Workout</label><select id="log-workout" name="workout_id" required></select>
    <div class="form-grid">
      <div><label for="performed-on">Date</label><input type="date" id="performed-on" name="performed_on" required></div>
      <div><label for="log-minutes">Actual time (minutes)</label><input type="number" id="log-minutes" name="duration_minutes" min="0" max="1440" step="0.1" required></div>
      <div><label for="log-status">How did it go?</label><select id="log-status" name="status"><option value="completed">Completed</option><option value="partial">Stopped early</option></select></div>
      <div><label for="log-calories">Estimated calories burned <span class="optional">(optional)</span></label><input type="number" id="log-calories" name="estimated_calories" min="0" max="50000" step="any" placeholder="From your tracker, if known"></div>
    </div>
    <details class="exercise-details"><summary>Record exercise sets <span class="optional">(optional)</span></summary><p class="small muted">Enter actual reps or seconds for each set you want to save. Empty sets stay unrecorded. Loads are shown in your preferred unit.</p><div id="exercise-fields"></div></details>
    <label for="log-notes">A note for next time <span class="optional">(optional)</span></label><textarea id="log-notes" name="notes" rows="2" maxlength="2000" placeholder="What felt good? What would you change?"></textarea>
    <button type="submit" class="primary-button">Save workout <span aria-hidden="true">✓</span></button>
  </form>
</dialog>
